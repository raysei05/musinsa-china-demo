function toggleLanguage(){const y=document.getElementById('content').scrollTop;state.lang=state.lang==='zh'?'ko':'zh';render();document.getElementById('content').scrollTop=y;}

// 03. Home screen.
function renderHome(){document.getElementById('content').innerHTML=`<div class="home fade-in"><label class="search">${icon('search')}<input type="search" value="${esc(state.query)}" placeholder="${t('search')}" aria-label="${t('search')}" oninput="searchProducts(this.value)"></label><div class="section-head"><span class="micro">${t('edit')}</span><span class="muted">${t('issue')}</span></div><div id="banner"></div><h2 class="category-heading">${t('categories')}</h2><div class="chips">${['all','sport','designer','standard','beautyChip'].map(k=>`<button class="chip ${state.category===k?'active':''}" onclick="selectCategory('${k}')" ${k==='beautyChip'?'':`aria-pressed="${state.category===k}"`}>${t(k)}</button>`).join('')}</div><div class="section-head"><h2 class="products-title">${t('picks')}</h2><span class="muted" id="count"></span></div><div class="products" id="products"></div><p class="footnote">${t('note').replace(/\n/g,'<br>')}</p></div>`;renderBanner();renderProducts();}

function setBanner(i){state.banner=i;renderBanner()}
function shiftBanner(n){setBanner((state.banner+n+3)%3)}
function openBanner(){if(state.banner===0)navigate('stores');else selectCategory(state.banner===1?'designer':'standard')}

function filteredProducts(){const q=state.query.trim().toLowerCase();return products.filter(p=>(state.category==='all'||p.cat===state.category)&&(!q||`${p.brand} ${p.zh} ${p.ko}`.toLowerCase().includes(q)))}

Object.assign(extraProductPhotos,{"101": "/assets/9f7dd1b5a7f1bc9fa0c5.png", "102": "/assets/5e676b3985932dcf8c34.png", "103": "/assets/673d23e9d970f47815e5.png", "104": "/assets/2b92c600891cf21589bc.png", "105": "/assets/82de59e77b37d5e57864.png", "106": "/assets/9b9a315e007be82ea823.png"});
function productPhoto(p,classes='product-visual',number=false){if(extraProductPhotos[p.id])return `<span class="${classes} product-photo extra-photo" role="img" aria-label="${esc(p[state.lang])}" style="background-image:url('${extraProductPhotos[p.id]}');background-size:cover;background-position:center">${number?`<span class="product-number" aria-hidden="true">${p.id}</span>`:''}</span>`;if(p.id<1||p.id>12)return '';const i=p.id-1;return `<span class="${classes} product-photo" role="img" aria-label="${esc(p[state.lang])}" style="--photo-x:${(i%3)*50}%;--photo-y:${Math.floor(i/3)*100/3}%">${number?`<span class="product-number" aria-hidden="true">${String(p.id).padStart(2,'0')}</span>`:''}</span>`;}
function visual(p){return productPhoto(p,'product-visual',true)||`<div class="product-visual"><span class="product-number">${String(p.id).padStart(2,'0')}</span><span class="brand-art ${p.brand.length>17?'small':''}">${esc(p.brand)}</span><span class="visual-label">MUSINSA SELECT</span></div>`;}

// 04. Staged destination screens. Replace each renderer as development continues.
function renderUpcoming(){const key={stores:'store',beauty:'beauty',ai:'ai'}[state.tab];document.getElementById('content').innerHTML=`<div class="placeholder fade-in"><div class="large-icon">${icon(state.tab)}</div><div class="micro">${t('stage')}</div><h2>${t(key+'Title')}</h2><p>${t('upcoming')}</p><div class="steps">${t(key+'Steps').map((s,i)=>`<div><span>0${i+1}</span>${s}</div>`).join('')}</div><button class="black-button" onclick="goHome()">${t('back')}</button></div>`;}

function openProduct(id){state.product=id;state.size='M';state.modal='product';renderModal()}
function showAbout(){state.modal='about';renderModal()}

const allProducts=()=>[...products,...beautyProducts];
const getProduct=id=>allProducts().find(p=>p.id===id);
const storeName=s=>s.name+' '+s[state.lang];
const stock=(pid,sid,size=state.size)=>{const base=[3,1,0,5][sid];return base===0?0:Math.max(0,base+(pid%3===0?1:0)-(size==='XL'?1:0));};
const stockText=n=>n===0?t('noStock'):n===1?t('lastOne'):t('inStock')+' '+n+t('units');
const itemCard=p=>`<button class="product" onclick="openProduct(${p.id})">${visual(p)}<div class="product-brand">${esc(p.brand)}</div><div class="product-name">${p[state.lang]}</div><div class="product-price">${price(p.price)}</div></button>`;
const oldFilter=filteredProducts;filteredProducts=()=>oldFilter().filter(p=>p.cat!=='aiOnly');
const oldNavigate=navigate;navigate=function(tab){if(tab==='stores'&&state.tab!=='stores')state.store=null;oldNavigate(tab)};
const oldRender=render;render=function(){oldRender();let btn=document.getElementById('cart-button');if(!btn){btn=document.createElement('button');btn.id='cart-button';btn.className='cart-badge';btn.onclick=()=>openCart();document.querySelector('.top-actions').prepend(btn)}btn.setAttribute('aria-label',t('cart'));btn.innerHTML='▢ <span class="cart-count">'+state.cart.reduce((n,x)=>n+x.qty,0)+'</span>';};

// 08. Store screens: list -> in-stock items -> product -> pickup.
function renderStores(){const el=document.getElementById('content');if(state.store!==null){const s=stores[state.store];const list=allProducts().filter(p=>stock(p.id,s.id,'M')>0);el.innerHTML=`<div class="page fade-in"><button class="back-link" onclick="selectStore(null)">← ${t('allStores')}</button><div class="store-cover">${s.id===1?'MUSINSA STORE':'MUSINSA STANDARD'}</div><div class="micro">${esc(s.name)}</div><h2 class="page-title">${s[state.lang]}</h2><p class="subtext">${s[state.lang==='zh'?'addressZh':'addressKo']}<br>${t('hours')} ${s.hours} · ${s.distance}</p><div class="section-head" style="margin-top:24px"><h3 style="font-size:14px;margin:0">${t('storeProducts')}</h3><span class="subtext">${list.length} ${t('items')}</span></div><div class="mini-grid">${list.map(itemCard).join('')}</div><p class="footnote">${t('stockNote')}<br>${t('note')}</p></div>`;return;}el.innerHTML=`<div class="page fade-in"><div class="micro">OFFLINE, ON YOUR WAY</div><div class="page-top"><h2 class="page-title">${t('stores')}</h2><button class="outline-button" onclick="openInfo('scan')">▦ ${t('scan')}</button></div><p class="subtext">${t('storeIntro')}</p>${state.booking?`<button class="order-chip" onclick="state.modal='success';renderModal()">✓ ${t('showBooking')} →</button>`:''}<h3 style="font-size:14px;margin-top:24px">${t('nearby')}</h3>${stores.map(s=>`<button class="store-card" onclick="selectStore(${s.id})"><div class="micro" style="margin-bottom:9px">0${s.id+1} / ${s.distance}</div><h3>${esc(s.name)}<br>${s[state.lang]}</h3><p class="store-meta">${s[state.lang==='zh'?'addressZh':'addressKo']}<br>${t('hours')} ${s.hours}</p><div class="store-footer"><span>${t('inventory')}</span><strong>↗</strong></div></button>`).join('')}<p class="footnote">${t('note')}</p></div>`;}
function selectStore(id){state.store=id;renderStores();if(id!==null&&!allProducts().some(p=>stock(p.id,id,'M')>0)){const grid=document.querySelector('.mini-grid');if(grid)grid.innerHTML=`<p class="empty">${t('noStock')}</p>`;}document.getElementById('content').scrollTop=0;}

function renderBeauty(){let list=beautyProducts.filter(p=>state.beautyCategory==='all'||p.cat===state.beautyCategory);document.getElementById('content').innerHTML=`<div class="page fade-in"><div class="beauty-hero"><span class="micro">SEOUL BEAUTY, EVERY DAY</span><h2>MUSINSA<br>BEAUTY.</h2><p>${t('beautyLaunch')}</p><div class="tiny">${t('beautyConcept')}</div></div><p class="subtext" style="margin-bottom:16px">${t('beautyIntro')}</p><div class="chips">${['all','base','lip','skin','scent'].map(k=>`<button class="chip ${state.beautyCategory===k?'active':''}" aria-pressed="${state.beautyCategory===k}" onclick="state.beautyCategory='${k}';renderBeauty()">${t(k)}</button>`).join('')}</div><div class="mini-grid">${list.map(itemCard).join('')}</div><h3 class="rank-title">${t('rank')}</h3>${beautyProducts.slice(0,5).map((p,i)=>`<button class="rank-row" onclick="openProduct(${p.id})"><span class="rank-no">${i+1}</span>${productPhoto(p,'rank-box')}<span class="rank-name"><small>K-BEAUTY</small>${p[state.lang]}</span><span class="rank-price">${price(p.price)}</span></button>`).join('')}<p class="footnote">${t('note')}</p></div>`;}

// 11. Product sheets, inventory, cart, sharing, and reservations.
function openProduct(id){state.product=id;state.size=id>=100||getProduct(id).oneSize?t('oneSize'):'M';state.modal='product';renderModal()}
function openInfo(kind){state.modal=kind;renderModal()}
function openCart(){state.modal='cart';renderModal()}
function toast(message){const el=document.getElementById('toast');el.innerHTML=`<div class="toast">${esc(message)}</div>`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>{el.innerHTML=''},2100);}
function addLine(id,size){const row=state.cart.find(x=>x.id===id&&x.size===size);if(row)row.qty++;else state.cart.push({id,size,qty:1});}
function addCurrent(){addLine(state.product,state.product>=100||getProduct(state.product).oneSize?'ONE':state.size);render();toast(t('added'));}
function addOutfit(){outfitIds(state.chat.scene).forEach(id=>addLine(id,'M'));render();toast(t('cartAddedAll'));}
function removeCart(i){state.cart.splice(i,1);render()}
function startPickup(){state.modal='pickStore';state.pickupStore=null;state.pickupSlot=0;renderModal()}
function choosePickup(sid){if(stock(state.product,sid)===0)return;state.pickupStore=sid;state.modal='pickTime';renderModal()}
function finishPickup(){if(state.pickupStore===null||stock(state.product,state.pickupStore)===0)return;state.booking={pid:state.product,size:state.product>=100||getProduct(state.product).oneSize?'ONE':state.size,sid:state.pickupStore,slot:state.pickupSlot,no:'MC-'+String(Date.now()).slice(-6)};state.modal='success';renderModal()}
function qrMock(){let cells='';for(let y=0;y<25;y++)for(let x=0;x<25;x++){const finder=(ox,oy)=>{const a=x-ox,b=y-oy;return a>=0&&a<7&&b>=0&&b<7?(a===0||a===6||b===0||b===6||a>=2&&a<=4&&b>=2&&b<=4):null};let value=null;for(const [a,b]of [[0,0],[18,0],[0,18]]){const v=finder(a,b);if(v!==null)value=v}if(value===null)value=(x*13+y*7+x*y)%5<2;if(value)cells+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;}return `<svg class="qr" viewBox="0 0 25 25" role="img" aria-label="${t('qrNote')}" style="fill:#151515;stroke:none">${cells}</svg>`;}
function inventoryRows(p,picking){return stores.map(s=>{const n=stock(p.id,s.id);return `<div class="inventory-row"><div>${esc(s.name)}<br>${s[state.lang]}<small>${stockText(n)}</small></div><button ${n===0?'disabled':''} onclick="choosePickup(${s.id})">${t('pick')}</button></div>`}).join('');}
renderModal=function(){const el=document.getElementById('modal');if(!state.modal){el.innerHTML='';return}const p=getProduct(state.product);let title='',body='',footer='';const kind=state.modal;
 if(kind==='product'){title=t('preview');body=`${visual(p)}<div class="product-brand">${esc(p.brand)}</div><div class="product-name">${p[state.lang]}</div><div class="product-price">${price(p.price)}</div><div class="size-label">${t(p.id>=100?'shade':'size')}</div>${(p.id>=100||p.oneSize)?`<div class="tags"><span>${t('oneSize')}</span></div>`:`<div class="sizes">${['S','M','L','XL'].map(s=>`<button class="size ${s===state.size?'active':''}" aria-pressed="${s===state.size}" onclick="chooseSize('${s}')">${s}</button>`).join('')}</div>`}<button class="secondary-wide" onclick="state.modal='inventory';renderModal()">${t('inventory')} →</button><div class="two-buttons"><button class="black-button" onclick="startPickup()">${t('pick')}</button><button class="black-button" onclick="addCurrent()">${t('addCart')}</button></div><button class="secondary-wide" onclick="state.modal='share';renderModal()">${t('share')}</button>`;}
 else if(kind==='inventory'||kind==='pickStore'){title=t(kind==='inventory'?'inventory':'chooseStore');body=`<p>${p[state.lang]} · ${(p.id>=100||p.oneSize)?t('oneSize'):state.size}</p><p class="tiny">${t('stockNote')}</p>${inventoryRows(p,true)}`;footer=`<button class="secondary-wide" onclick="state.modal='product';renderModal()">${t('backDetail')}</button>`;}
 else if(kind==='pickTime'){title=t('chooseTime');body=`<p>${storeName(stores[state.pickupStore])}<br>${p[state.lang]} · ${(p.id>=100||p.oneSize)?t('oneSize'):state.size}</p><p class="tiny">${t('dateDemo')}</p><div class="time-grid">${t('slots').map((s,i)=>`<button class="time-option ${state.pickupSlot===i?'active':''}" aria-pressed="${state.pickupSlot===i}" onclick="state.pickupSlot=${i};renderModal()">${s}</button>`).join('')}</div>`;footer=`<button class="black-button" onclick="finishPickup()">${t('confirmPickup')}</button>`;}
 else if(kind==='success'){title=t('bookingTitle');const b=state.booking;body=`<div class="success-content"><div class="success-mark">✓</div><h3>${t('success')}</h3><p>${t('bookingNo')} ${b.no}</p>${qrMock()}<p>${t('qrNote')}</p></div><div class="reservation-summary"><p>${storeName(stores[b.sid])}<br>${getProduct(b.pid)[state.lang]} · ${b.size==='ONE'?t('oneSize'):b.size}<br>${t('slots')[b.slot]}</p></div><p class="tiny">${t('bookingNote')}</p>`;footer=`<button class="black-button" onclick="closeModal();if(state.tab==='stores')renderStores()">${t('okay')}</button>`;}
 else if(kind==='cart'){title=t('cart');body=state.cart.length?state.cart.map((x,i)=>`<div class="inventory-row">${productPhoto(getProduct(x.id),'rank-box')}<div style="flex:1">${getProduct(x.id)[state.lang]}<small>${x.size==='ONE'?t('oneSize'):x.size} · ${t('quantity')} ${x.qty} · ${price(getProduct(x.id).price*x.qty)}</small></div><button onclick="removeCart(${i})">${t('remove')}</button></div>`).join('')+`<div class="total"><span>${t('total')}</span><strong>${price(state.cart.reduce((n,x)=>n+getProduct(x.id).price*x.qty,0))}</strong></div>`:`<div class="cart-empty">${t('emptyCart')}</div>`;body+=`<p class="tiny">${t('cartNote')}</p>`;}
 else if(kind==='share'){title=t('shareTitle');body=`<div class="reservation-summary"><div class="product-brand">${esc(p.brand)}</div><p>${p[state.lang]} · ${price(p.price)}</p></div><p style="margin-top:15px">${t('shareText')}</p>`;}
 else if(kind==='scan'){title=t('scanTitle');body=`<div class="store-cover">WECHAT × MUSINSA</div><p>${t('scanText')}</p>`;}
 else {title=t('about');body=`<p>${t('aboutBody')}</p>`;}
 el.innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="sheet fade-in" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="sheet-head"><h2 id="modal-title">${title}</h2><button class="close" aria-label="${t('close')}" onclick="closeModal()">×</button></div>${body}${footer||(['product','inventory','pickStore'].includes(kind)?'':`<button class="black-button" onclick="closeModal()">${t('okay')}</button>`)}</section></div>`;
};
render();
</script>
